name: Lint Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: [nightly, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - uses: reviewdog/action-setup@3f401fe80b9bb9919f564177c385fb173ea3ffde # v1.3.0
        with:
          reviewdog_version: latest

      - name: Lint changed lines with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yarn eslint . --max-warnings 0 | reviewdog -f=eslint -reporter=github-check -filter-mode=diff_context -fail-level=error
