name: Lint Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: [nightly, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - uses: reviewdog/action-setup@3f401fe1d58fe77e10d665ab713057375e39b887 # v1.3.0
        with:
          reviewdog_version: latest

      - name: Run ESLint on all files
        # FIX 1: Switched to JSON to resolve the absolute/relative path mismatch
        run: yarn eslint . --format=json --output-file=eslint-report.json || true

      - name: Lint changed with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORTER=$([[ "${{ github.event_name }}" == "pull_request" ]] && echo "github-pr-review" || echo "github-check")

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="HEAD^1"
          else
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_REF="HEAD~1"
            else
              BASE_REF="${{ github.event.before }}"
            fi
          fi

          reviewdog -f=eslintjson -name="eslint" -reporter=$REPORTER -filter-mode=diff_context -base=$BASE_REF -fail-level=error < eslint-report.json
