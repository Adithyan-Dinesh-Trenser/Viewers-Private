name: Lint Check

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Full Repo Lint (Informational Only)
        run: yarn eslint . || true

      - name: Run ESLint strictly on Changed Lines (Blocking)
        run: |
          # 1. Create a temporary config that inherits OHIF's base config
          # but applies the 'diff/ci' mode to filter output to changed lines only
          echo '{ "extends": ["./.eslintrc.json", "plugin:diff/ci"] }' > .eslintrc.diff.json

          # 2. Determine the target commit for the git diff comparison
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # If pushing a new branch, fallback to diffing against the parent commit
            export ESLINT_PLUGIN_DIFF_COMMIT="HEAD~1"
          else
            export ESLINT_PLUGIN_DIFF_COMMIT="${{ github.event.before }}"
          fi

          # 3. Filtering changed files. The grep step also prevents passing deleted files to ESLint, which causes crashes
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT $ESLINT_PLUGIN_DIFF_COMMIT HEAD | grep -E '\.(js|jsx|ts|tsx)$' || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "Linting the following changed files:"
            echo "$CHANGED_FILES"

            # 4. Run eslint specifically on those files using the custom diff config.
            # Convert newlines to spaces so they are passed correctly as arguments.
            FILES_TO_LINT=$(echo $CHANGED_FILES | tr '\n' ' ')

            yarn eslint --no-error-on-unmatched-pattern --config .eslintrc.diff.json $FILES_TO_LINT
          else
            echo "No tracked JS/TS files were changed in this push. Skipping linting."
          fi
